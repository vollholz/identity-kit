# Veröffentlichung: Nach jedem Merge auf main (und von Hand) prüft der Workflow alle Pakete und veröffentlicht jedes,
# dessen Version noch nicht auf GitHub Packages liegt (@vollholz/*). Je veröffentlichtem Paket entsteht ein Tag
# `<paket>-v<version>` (z. B. iam-testkit-v0.1.1) und ein GitHub Release zum Tag mit dem Abschnitt der Version aus
# packages/<paket>/CHANGELOG.md als Text. Eine neue Version = Version in packages/<paket>/package.json erhöhen, Abschnitt
# in CHANGELOG.md schreiben (Prüfung in ci.yml) und per PR mergen; ohne erhöhte Version veröffentlicht der Workflow nichts.
# OpenTofu-Module (modules/<modul>/VERSION) bekommen nur ein Tag `<modul>-v<version>` (z. B. product-realm-v0.1.0); Apps
# beziehen sie über `?ref=<modul>-v<version>`.
name: Release

on:
  push:
    branches: [main]
    paths: ["packages/**", "modules/*/VERSION", "package-lock.json", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Pakete veröffentlichen
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write        # Tags und GitHub Releases der veröffentlichten Versionen
      packages: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-superuser
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      POSTGRES_SUPERUSER_PASSWORD: ci-superuser
      POSTGRES_PORT: "5433"
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@vollholz"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Neue Versionen veröffentlichen, taggen und als GitHub Release anlegen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in packages/*/; do
            [ -f "${p}package.json" ] || continue   # Gerüst ohne Paket (nur README)
            name="$(node -p "require('./${p}package.json').name")"
            version="$(node -p "require('./${p}package.json').version")"
            private="$(node -p "!!require('./${p}package.json').private")"
            [ "$private" = "false" ] || continue
            tag="${name#@vollholz/}-v$version"
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version liegt schon vor"
              # Release nachtragen (z. B. Lauf nach dem Veröffentlichen abgebrochen), wenn Tag und Abschnitt bestehen
              if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1 && ! gh release view "$tag" >/dev/null 2>&1 \
                && node scripts/changelog.ts notes "$p" "$version" > "$RUNNER_TEMP/notes.md" 2>/dev/null; then
                gh release create "$tag" --verify-tag --title "$name@$version" --notes-file "$RUNNER_TEMP/notes.md"
                echo "GitHub Release nachgetragen: $tag"
              fi
              continue
            fi
            # Text vor dem Veröffentlichen: ohne Abschnitt in CHANGELOG.md keine Version
            notes="$RUNNER_TEMP/notes-${name#@vollholz/}.md"
            node scripts/changelog.ts notes "$p" "$version" > "$notes"
            npm publish --workspace "$p"
            git tag -a "$tag" -m "$name@$version"
            git push origin "$tag"
            gh release create "$tag" --verify-tag --title "$name@$version" --notes-file "$notes"
            echo "veröffentlicht: $name@$version ($tag, GitHub Release)"
          done
      - name: Neue Modulversionen taggen
        run: |
          for v in modules/*/VERSION; do
            [ -f "$v" ] || continue
            mod="$(basename "$(dirname "$v")")"
            version="$(tr -d '[:space:]' < "$v")"
            tag="$mod-v$version"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "$tag liegt schon vor"
              continue
            fi
            git tag -a "$tag" -m "$mod $version"
            git push origin "$tag"
            echo "getaggt: $tag"
          done
