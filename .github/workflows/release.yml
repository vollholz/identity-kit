# Veröffentlichung: Nach jedem Merge auf main (und von Hand) prüft der Workflow alle Pakete und veröffentlicht jedes,
# dessen Version noch nicht auf GitHub Packages liegt (@vollholz/*). Je veröffentlichtem Paket entsteht ein Tag
# `<paket>-v<version>` (z. B. iam-testkit-v0.1.1). Eine neue Version = Version in packages/<paket>/package.json erhöhen
# und per PR mergen; ohne erhöhte Version veröffentlicht der Workflow nichts.
name: Release

on:
  push:
    branches: [main]
    paths: ["packages/**", "package-lock.json", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Pakete veröffentlichen
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write        # Tags der veröffentlichten Versionen
      packages: write
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-superuser
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      POSTGRES_SUPERUSER_PASSWORD: ci-superuser
      POSTGRES_PORT: "5433"
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@vollholz"
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Neue Versionen veröffentlichen und taggen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in packages/*/; do
            [ -f "${p}package.json" ] || continue   # Gerüst ohne Paket (nur README)
            name="$(node -p "require('./${p}package.json').name")"
            version="$(node -p "require('./${p}package.json').version")"
            private="$(node -p "!!require('./${p}package.json').private")"
            [ "$private" = "false" ] || continue
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version liegt schon vor"
              continue
            fi
            npm publish --workspace "$p"
            tag="${name#@vollholz/}-v$version"
            git tag -a "$tag" -m "$name@$version"
            git push origin "$tag"
            echo "veröffentlicht: $name@$version ($tag)"
          done
